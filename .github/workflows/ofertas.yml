name: Ofertas del día
on:
  schedule:
    - cron: '17 6 * * *'   # cada día ~7:17 (hora de Madrid en invierno)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['busquedas.json', 'scripts/ofertas.mjs', '.github/workflows/ofertas.yml']
permissions:
  contents: write
concurrency:
  group: ofertas
  cancel-in-progress: false
jobs:
  ofertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar ofertas
        run: node scripts/ofertas.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Guardar
        run: |
          git config user.name "ofertas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --cached --quiet && exit 0
          git commit -m "Ofertas del día"
          git pull --rebase
          git push
